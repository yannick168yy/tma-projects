server:
  port: ${CORE_PORT:8080}

spring:
  application:
    name: betogo-core-java
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/betogo?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:betogo}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

management:
  endpoints:
    web:
      exposure:
        include: health
