  <line x1="12" y1="22" x2="20" y2="22" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <line x1="12" y1="30" x2="20" y2="30" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
