      <stop offset="0" stop-color="#00A651"/>
      <stop offset="1" stop-color="#006B35"/>
    </linearGradient>
  </defs>
  <rect width="96" height="44" rx="10" fill="url(#bg)"/>
  <!-- net dots -->
  <circle cx="12" cy="14" r="2" fill="rgba(255,255,255,0.6)"/>
  <circle cx="20" cy="14" r="2" fill="rgba(255,255,255,0.6)"/>
  <circle cx="12" cy="22" r="2" fill="rgba(255,255,255,0.6)"/>
