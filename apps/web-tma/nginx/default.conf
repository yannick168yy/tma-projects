server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # public 根目录静态资源(无内容哈希,不能 immutable):字体/图标/厂商logo/站标/manifest
    location ~ ^/(fonts|icons|logos|providers)/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location ~ ^/(favicon\.svg|manifest\.webmanifest)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # service worker 必须即时更新,禁缓存
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /kyc-setting {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
