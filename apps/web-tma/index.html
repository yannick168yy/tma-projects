<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#080b14" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080b14" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- 提前建连,缩短 Turnstile iframe 冷加载(首次白屏)时长 -->
    <link rel="preconnect" href="https://challenges.cloudflare.com" crossorigin />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="BETOGO" />
    <title>BETOGO</title>
    <style>
      html, body { min-height: 100%; margin: 0; background: #080b14; }
      .initial-loader { position: fixed; inset: 0; display: grid; place-content: center; gap: 18px; color: #fff; font-family: system-ui, sans-serif; text-align: center; }
      .initial-loader__logo { font-size: 30px; font-weight: 900; letter-spacing: -1.5px; }
      .initial-loader__logo span { color: #ffb800; }
      .initial-loader__dots { display: flex; justify-content: center; gap: 7px; }
      .initial-loader__dots i { width: 7px; height: 7px; border-radius: 50%; background: #ffb800; animation: initial-loader-bounce .9s ease-in-out infinite; }
      .initial-loader__dots i:nth-child(2) { animation-delay: .15s; }
      .initial-loader__dots i:nth-child(3) { animation-delay: .3s; }
      @keyframes initial-loader-bounce { 0%, 100% { opacity: .35; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-5px); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="initial-loader" role="status" aria-label="Loading BETOGO">
        <div class="initial-loader__logo">BETO<span>GO</span></div>
        <div class="initial-loader__dots" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
