<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 448" role="img" aria-labelledby="title desc">
  <title id="title">3-Circle Rewards</title>
  <desc id="desc">Share once and earn rewards from three circles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset=".28" stop-color="#55f06f"/>
      <stop offset=".58" stop-color="#ffe54f"/>
      <stop offset="1" stop-color="#ff4d8d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".88"/>
      <stop offset=".52" stop-color="#fff2a8" stop-opacity=".58"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".78"/>
    </linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff176"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62f5ff"/>
      <stop offset="1" stop-color="#2d7dff"/>
    </linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7af5"/>
      <stop offset="1" stop-color="#8e58ff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#4a0b58" flood-opacity=".23"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="768" height="448" rx="44" fill="url(#bg)"/>
  <circle cx="72" cy="76" r="46" fill="#fff" opacity=".18"/>
  <circle cx="690" cy="86" r="58" fill="#fff" opacity=".16"/>
  <circle cx="708" cy="366" r="70" fill="#fff" opacity=".13"/>
  <circle cx="90" cy="354" r="64" fill="#fff" opacity=".12"/>

  <g opacity=".36">
    <path d="M44 158h72M78 122v72M650 184h72M686 148v72" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
    <path d="M172 66l12 24 26 4-19 18 4 26-23-12-23 12 4-26-19-18 26-4z" fill="#fff"/>
    <path d="M588 322l9 19 21 3-15 15 4 21-19-10-19 10 4-21-15-15 21-3z" fill="#fff"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="42" y="38" width="684" height="372" rx="34" fill="url(#panel)"/>
    <rect x="42" y="38" width="684" height="372" rx="34" fill="#fff" opacity=".1"/>
