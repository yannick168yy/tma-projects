    <path d="M384 190c26 16 57 21 93 28"/>
    <path d="M276 241c-25 17-43 30-60 52"/>
    <path d="M492 241c25 17 43 30 60 52"/>
  </g>

  <g filter="url(#softShadow)">
    <path d="M600 166h70l-10 95h-50z" fill="#ff3972"/>
    <path d="M590 162h90v29h-90z" fill="#ffe45a"/>
    <path d="M604 142h62l18 24h-98z" fill="#ff9f1c"/>
    <rect x="624" y="190" width="25" height="48" rx="8" fill="#fff" opacity=".88"/>
    <text x="635" y="289" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="19" fill="#2a2250">WALLET</text>
  </g>

  <g filter="url(#glow)">
    <path d="M454 225c50-6 91-20 134-46" fill="none" stroke="#fff27a" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 18"/>
    <path d="M454 270c52 2 91-12 134-48" fill="none" stroke="#fff27a" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 18"/>
    <path d="M454 313c54 14 98-9 134-48" fill="none" stroke="#fff27a" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 18"/>
  </g>

  <g fill="#ffd83d" stroke="#ff9f1c" stroke-width="4" filter="url(#softShadow)">
    <circle cx="548" cy="196" r="13"/>
    <circle cx="574" cy="215" r="10"/>
    <circle cx="536" cy="255" r="11"/>
    <circle cx="570" cy="281" r="12"/>
    <circle cx="524" cy="312" r="10"/>
    <circle cx="560" cy="340" r="12"/>
  </g>
</svg>
