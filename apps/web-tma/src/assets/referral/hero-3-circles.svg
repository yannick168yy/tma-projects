    <g transform="translate(384 220)">
      <rect x="-35" y="-18" width="70" height="36" rx="18" fill="#fff"/>
      <text y="7" font-size="22" fill="#cc6a00">C1</text>
    </g>
    <g transform="translate(384 268)">
      <rect x="-35" y="-18" width="70" height="36" rx="18" fill="#fff"/>
      <text y="7" font-size="22" fill="#1567db">C2</text>
