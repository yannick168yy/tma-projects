  <text x="384" y="87" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="42" font-weight="900" fill="#23204c">3-CIRCLE REWARDS</text>
  <text x="384" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#7b2e8d">Share Once</text>

  <g filter="url(#glow)">
    <path d="M214 307c78-98 262-98 340 0" fill="none" stroke="url(#c3)" stroke-width="36" stroke-linecap="round" opacity=".98"/>
    <path d="M262 266c58-66 186-66 244 0" fill="none" stroke="url(#c2)" stroke-width="34" stroke-linecap="round" opacity=".98"/>
    <path d="M314 224c34-34 106-34 140 0" fill="none" stroke="url(#c1)" stroke-width="32" stroke-linecap="round" opacity=".98"/>
  </g>

  <g font-family="Arial Black, Arial, sans-serif" font-weight="900" text-anchor="middle">
