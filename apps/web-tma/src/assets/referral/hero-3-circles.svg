    <g transform="translate(210 294)">
      <circle r="21" fill="#fff"/>
      <circle cy="-3" r="10" fill="#815cff"/>
      <path d="M-14 17c5-16 23-16 28 0z" fill="#815cff"/>
    </g>
    <g transform="translate(558 294)">
      <circle r="21" fill="#fff"/>
      <circle cy="-3" r="10" fill="#28d878"/>
      <path d="M-14 17c5-16 23-16 28 0z" fill="#28d878"/>
    </g>
    <g transform="translate(160 335)">
      <circle r="18" fill="#fff"/>
      <circle cy="-3" r="8" fill="#ff9f1c"/>
      <path d="M-12 15c4-13 20-13 24 0z" fill="#ff9f1c"/>
    </g>
    <g transform="translate(608 335)">
      <circle r="18" fill="#fff"/>
      <circle cy="-3" r="8" fill="#00b6ff"/>
      <path d="M-12 15c4-13 20-13 24 0z" fill="#00b6ff"/>
    </g>
  </g>

  <g fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".92">
