# 平台控制台（包网运营商管理）。安全基线比业务后台更严：
# 它能开站、改套餐、看所有租户的钱，绝不能与租户站点共用域名或暴露在公网。
# 访问控制放在宿主 nginx（见 deploy/single-node/nginx-platform-prod.conf），
# 这里只负责静态资源与 API 反代。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location = / { return 301 /platform/; }

    location /platform/assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        # location 内出现 add_header 会丢弃 server 级头，必须重复声明
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location /api/ {
        resolver 10.89.0.1 valid=30s ipv6=off;
        set $upstream http://tma-bff-node:3000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /platform/ {
        try_files $uri $uri/ /platform/index.html;
    }

    location = /platform/index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
