<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>BetoGo · 官方线路入口</title>
<style>
  :root{
    --bg:#0A0C14; --card:#111623; --card2:#0d1220; --line:rgba(255,255,255,.08);
    --gold:#FFB800; --gold2:#ffcf4d; --text:#eef2f8; --muted:#8b93a7;
    --green:#22c55e; --red:#ef4444; --amber:#f59e0b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:radial-gradient(1200px 600px at 50% -10%,#16203a 0%,var(--bg) 55%) no-repeat,var(--bg);
    color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 16px 40px;display:flex;justify-content:center;
  }
  .wrap{width:100%;max-width:460px}
  /* header */
  .brand{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 0 20px}
  .logo{width:66px;height:66px;border-radius:18px;background:linear-gradient(145deg,#141a2b,#0a0e18);
    border:1px solid rgba(255,184,0,.35);display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 40px rgba(255,184,0,.14);margin-bottom:12px}
  .logo span{font-weight:900;font-size:26px;color:var(--gold);letter-spacing:-1px}
  .name{font-size:26px;font-weight:900;letter-spacing:.5px}
  .name b{color:var(--gold)}
  .tag{color:var(--muted);font-size:13px;margin-top:6px;letter-spacing:.3px}
  /* card */
  .card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);
    border-radius:20px;padding:18px;margin-top:14px}
  .card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .card-t{font-size:14px;font-weight:800;letter-spacing:.3px}
  .card-s{font-size:11px;color:var(--muted)}
  /* primary enter */
  .enter{width:100%;border:none;border-radius:16px;padding:17px;font-size:17px;font-weight:900;letter-spacing:.5px;
    background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1300;cursor:pointer;
    box-shadow:0 10px 30px rgba(255,184,0,.28);transition:transform .12s,filter .12s;display:flex;
    align-items:center;justify-content:center;gap:8px}
  .enter:active{transform:translateY(1px) scale(.995)}
  .enter:disabled{filter:grayscale(.7) brightness(.7);cursor:default;box-shadow:none}
  .enter .spin{width:16px;height:16px;border:2px solid rgba(26,19,0,.35);border-top-color:#1a1300;border-radius:50%;
    animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hint{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
  .hint b{color:var(--gold)}
  /* mirror list */
  .lines{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .line{display:flex;align-items:center;gap:12px;background:#0c111d;border:1px solid var(--line);
    border-radius:14px;padding:12px 14px}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--amber);position:relative}
  .dot.live{background:var(--green);box-shadow:0 0 0 4px rgba(34,197,94,.14)}
  .dot.dead{background:var(--red)}
  .dot.checking{background:var(--amber);animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  .line-main{flex:1;min-width:0}
  .line-url{font-size:14px;font-weight:800;font-variant:tabular-nums}
  .line-meta{font-size:11px;color:var(--muted);margin-top:2px}
  .line-btn{border:1px solid rgba(255,184,0,.4);background:rgba(255,184,0,.08);color:var(--gold);
    font-size:12px;font-weight:800;border-radius:10px;padding:8px 14px;cursor:pointer;flex:none}
  .line-btn:disabled{opacity:.35;cursor:default;border-color:var(--line);color:var(--muted);background:transparent}
  /* verify / channels */
  .verify{background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.22)}
  .verify .card-t{color:#7ee2a3}
  .off{font-size:13px;font-weight:800;font-variant:tabular-nums;padding:8px 0;border-bottom:1px dashed var(--line)}
  .off:last-child{border:none}
  .off small{color:var(--muted);font-weight:600;margin-left:6px}
  .warn{font-size:12px;color:#f4c77b;margin-top:10px;line-height:1.5}
  .row{display:flex;gap:10px}
  .row .btn2{flex:1;text-align:center;text-decoration:none;color:var(--text);background:#0c111d;border:1px solid var(--line);
    border-radius:14px;padding:14px 8px;font-size:13px;font-weight:800}
  .row .btn2 .ic{display:block;font-size:20px;margin-bottom:5px}
  .foot{text-align:center;color:var(--muted);font-size:11px;margin-top:22px;line-height:1.7}
  .age{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:8px;padding:2px 8px;margin-bottom:8px}
  .age b{color:#e6eaf2}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="logo"><span>GO</span></div>
    <div class="name">BET<b>O</b>GO</div>
    <div class="tag">官方唯一线路入口 · Official Portal</div>
  </div>

  <!-- 主入口：自动指向最快可用线路 -->
  <div class="card">
    <div class="card-h">
      <div class="card-t">🚀 进入游戏</div>
      <div class="card-s" id="scanStatus">线路检测中…</div>
    </div>
    <button class="enter" id="enterBtn" disabled>
      <span class="spin"></span><span id="enterTxt">正在为你选择最快线路…</span>
    </button>
    <div class="hint">系统已自动为你挑选 <b>延迟最低</b> 的可用线路。若打不开，请在下方手动切换其它线路。</div>
  </div>

  <!-- 线路列表 -->
  <div class="card">
    <div class="card-h"><div class="card-t">📡 全部线路</div><div class="card-s">绿=畅通 · 红=受阻</div></div>
    <div class="lines" id="lines"></div>
  </div>

  <!-- 防钓鱼：官方域名核验 -->
  <div class="card verify">
    <div class="card-h"><div class="card-t">🛡 认准官方域名</div><div class="card-s">谨防假冒</div></div>
    <div id="official"></div>
    <div class="warn">⚠️ 除上述域名及本页外，其它均为仿冒钓鱼站。请勿在假冒站点输入账号密码，谨防资金被盗。</div>
  </div>

  <!-- 下载 / 官方渠道 -->
  <div class="card">
    <div class="card-h"><div class="card-t">📲 App 与官方渠道</div></div>
    <div class="row">
      <a class="btn2" id="apk" href="#"><span class="ic">🤖</span>Android<br>App 下载</a>
      <a class="btn2" id="tg" href="#" target="_blank" rel="noopener"><span class="ic">✈️</span>官方<br>Telegram</a>
      <a class="btn2" id="cs" href="#" target="_blank" rel="noopener"><span class="ic">🎧</span>在线<br>客服</a>
    </div>
  </div>

  <div class="foot">
    <div class="age">🔞 <b>18+</b> 理性博彩</div><br>
    © 2026 BetoGo · 请在法律允许的地区娱乐，量力而行，切勿沉迷
  </div>
</div>

<script>
/* ============================================================
   配置区：换域名 / 加镜像只改这里
   ============================================================ */
const CONFIG = {
  // 实际"进去玩"的境外可轮换镜像，按优先级排列
  mirrors: [
    { url: 'https://www.188facai.com', label: '线路 1（测试环境·当前在线）' },
    { url: 'https://betogo.win',       label: '线路 2' },
    { url: 'https://betogo.vip',       label: '线路 3' },
    { url: 'https://betogo.co',        label: '线路 4' },
  ],
  // 官方域名核验清单（给用户比对防钓鱼）
  official: [
    { d: 'betogo.ph',  note: '本页·官方门户' },
    { d: 'betogo.win', note: '游戏线路' },
    { d: 'betogo.vip', note: '游戏线路' },
  ],
  apkUrl: 'https://www.188facai.com/download',
  telegram: 'https://t.me/',
  cs: 'https://www.188facai.com',
  timeoutMs: 5000,
};

/* ============================================================
   线路探活：no-cors fetch + 超时竞速，测可达性与延迟
   ============================================================ */
function ping(url, timeout){
  return new Promise((resolve)=>{
    const started = performance.now();
    const ctrl = new AbortController();
    const timer = setTimeout(()=>{ ctrl.abort(); resolve({alive:false, ms:null}); }, timeout);
    fetch(url + '/favicon.ico?_=' + started, { mode:'no-cors', cache:'no-store', signal: ctrl.signal })
      .then(()=>{ clearTimeout(timer); resolve({alive:true, ms: Math.round(performance.now()-started)}); })
      .catch(()=>{ clearTimeout(timer); resolve({alive:false, ms:null}); });
  });
}

const linesEl = document.getElementById('lines');
const enterBtn = document.getElementById('enterBtn');
const enterTxt = document.getElementById('enterTxt');
const scanStatus = document.getElementById('scanStatus');
const state = CONFIG.mirrors.map(m => ({...m, alive:null, ms:null}));

function render(){
  linesEl.innerHTML = state.map((s,i)=>{
    const cls = s.alive===null ? 'checking' : s.alive ? 'live' : 'dead';
    const meta = s.alive===null ? '检测中…' : s.alive ? `畅通 · ${s.ms}ms` : '当前受阻，请换线路';
    const host = s.url.replace(/^https?:\/\//,'');
    return `<div class="line">
      <span class="dot ${cls}"></span>
      <div class="line-main"><div class="line-url">${host}</div><div class="line-meta">${s.label} · ${meta}</div></div>
      <button class="line-btn" ${s.alive?'':'disabled'} onclick="go('${s.url}')">进入</button>
    </div>`;
  }).join('');
}

/* 归因参数透传：本页是买量落地的第一跳，不带过去站内就认不出这个人是哪条线来的 */
const TRACK_KEYS = ['c','utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','ttclid','gclid','px','tpx','ref'];
function trackQuery(){
  const src = new URLSearchParams(location.search);
  const out = new URLSearchParams();
  for(const k of TRACK_KEYS){ const v = src.get(k); if(v) out.set(k, v); }
  return out.toString();
}
function withTrack(url){
  const q = trackQuery();
  if(!q) return url;
  return url + (url.includes('?') ? '&' : '?') + q;
}

function go(url){ location.href = withTrack(url); }

function updatePrimary(){
  const live = state.filter(s=>s.alive).sort((a,b)=>a.ms-b.ms);
  if(live.length){
    const best = live[0];
    enterBtn.disabled = false;
    enterBtn.querySelector('.spin').style.display='none';
    enterTxt.textContent = '立即进入 · ' + best.url.replace(/^https?:\/\//,'');
    enterBtn.onclick = ()=>go(best.url);
    scanStatus.textContent = `已选最快线路 ${best.ms}ms`;
    scanStatus.style.color = 'var(--green)';
  } else if(state.every(s=>s.alive!==null)){
    enterBtn.querySelector('.spin').style.display='none';
    enterTxt.textContent = '暂无可用线路，请稍后重试';
    scanStatus.textContent = '全部受阻';
    scanStatus.style.color = 'var(--red)';
  }
}

async function scan(){
  render();
  await Promise.all(state.map(async (s,i)=>{
    const r = await ping(s.url, CONFIG.timeoutMs);
    s.alive = r.alive; s.ms = r.ms;
    render(); updatePrimary();
  }));
}

// 官方域名清单
document.getElementById('official').innerHTML = CONFIG.official
  .map(o=>`<div class="off">${o.d}<small>${o.note}</small></div>`).join('');
document.getElementById('apk').href = withTrack(CONFIG.apkUrl);
document.getElementById('tg').href = CONFIG.telegram; // 站外，不带归因参数
document.getElementById('cs').href = withTrack(CONFIG.cs);

scan();
</script>
</body>
</html>
