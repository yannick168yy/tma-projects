# Matrix 提现反查（同步加密响应）
location = /api/v1/callback/matrix/withdraw-check {
    proxy_pass http://127.0.0.1:4000/api/v1/callback/matrix/withdraw-check;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── 其余 /api/ → bff-node:3000 ───────────────────────────────────────────────

# Admin SSE 角标推送（需关闭缓冲，否则 EventSource 收不到实时数据）
location = /api/v1/admin/dashboard/badges/stream {
    proxy_pass http://127.0.0.1:3000/api/v1/admin/dashboard/badges/stream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
    chunked_transfer_encoding off;
}

location /api/ {
    proxy_pass http://127.0.0.1:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Slotegrator 回调（验签+处理均在 core-node）
location = /v1/slotegrator/callback {
    proxy_pass http://127.0.0.1:4000/api/v1/sg/callback;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
