# ── 支付回调 → core-node:4000（验签+账变在 core-node 处理）──────────────────

# 568Win Seamless Wallet 回调
location ~ ^/(GetBalance|Deduct|Settle|Rollback|Cancel|Bonus|GetBetStatus)$ {
    allow 122.146.58.49;
    allow 61.220.125.7;
    allow 61.220.125.8;
    allow 220.130.194.76;
    allow 111.235.225.61;
    allow 111.235.225.62;
    allow 125.227.48.247;
    allow 125.227.48.248;
    allow 136.228.131.134;
    allow 163.47.15.15;
    allow 103.60.253.249;
    allow 103.60.255.247;
    allow 15.152.236.209;
    allow 15.152.26.49;
    allow 203.176.129.162;
    allow 103.60.252.203;
    allow 103.60.252.250;
    allow 103.60.253.203;
    allow 103.60.254.250;
    allow 103.60.254.203;
    allow 103.60.255.203;
    allow 203.57.34.203;
    allow 203.57.35.203;
    allow 103.60.252.204;
    allow 103.60.253.205;
    allow 103.60.253.221;
    allow 43.198.1.150;
    allow 15.152.117.63;
    allow 43.218.41.172;
    allow 52.194.35.1;
    allow 34.92.69.111;
    allow 34.80.140.183;
    allow 34.96.190.70;
    allow 34.95.200.210;
    deny all;

    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# YF Pay 充值/提现回调
location = /api/v1/callback/yfpay {
    proxy_pass http://127.0.0.1:4000/api/v1/callback/yfpay;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Matrix 通知回调
location = /api/v1/callback/matrix {
    proxy_pass http://127.0.0.1:4000/api/v1/callback/matrix;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
