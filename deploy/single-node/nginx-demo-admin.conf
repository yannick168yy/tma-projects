# 演示后台 demo-admin.betogo.games
#
# 部署（阿里云测试机，宝塔 nginx）：
#   1. DNS 加 A 记录：demo-admin.betogo.games → 47.84.34.139
#   2. 签证书：certbot certonly --webroot -w /www/wwwroot/188facai.com \
#                -d demo-admin.betogo.games
#   3. 本文件复制到 /www/server/panel/vhost/nginx/demo-admin.betogo.games.conf
#   4. nginx -t && nginx -s reload
#
# 只需要一个 location：web-admin 容器内部已经把 /api/ 转给了 tma-bff-node，
# 并且一路 proxy_set_header Host $host。Host 链路是
#   浏览器 → 本 server → web-admin:8085 → bff:3000
# 全程保持 demo-admin.betogo.games，bff 的 tenantMiddleware 才能解析出
# demo 租户、落到 betogo_demo 库。这条链上任何一环把 Host 改写成别的值，
# 演示后台就会读到自营站的库 —— 这是整个演示站最要命的一种故障。

server {
    listen 80;
    server_name demo-admin.betogo.games;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name demo-admin.betogo.games;

    ssl_certificate     /etc/letsencrypt/live/demo-admin.betogo.games/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo-admin.betogo.games/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # 演示环境不希望被搜索引擎收录
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 后台的导出、报表这类请求慢，默认 60s 会截断
        proxy_read_timeout 300s;
    }
}
