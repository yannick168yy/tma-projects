# 演示后台 demo-admin.betogo.games —— 生产 AWS 的实际配置（已部署）
#
# 部署方式：
#   1. 本文件放到 /etc/nginx/sites-available/ 并软链到 sites-enabled/
#   2. sudo nginx -t && sudo systemctl reload nginx
#   3. sudo certbot --nginx -d demo-admin.betogo.games --non-interactive --agree-tos --redirect
#      （443 段与 80 跳转段由 certbot 自动写入，标着 managed by Certbot）
#
# $connection_upgrade 由 sites-enabled/betogo.games.conf 里的 map 定义，全局可用。
#
# 演示后台 demo-admin.betogo.games
#
# 与 admin.betogo.games 同构：SSE 那条 location 直连 bff，其余走 web-admin 容器。
#
# 🔴 Host 必须一路透传：浏览器 → 本 server → web-admin:8085 → bff:3000
#    全程保持 demo-admin.betogo.games，bff 的 tenantMiddleware 才能解析出 demo
#    租户、落到 betogo_demo 库。任何一环改写 Host，演示后台就会读到生产库
#    （2300+ 真实用户）—— 这是这个站最要命的一种故障。
server {
    server_name demo-admin.betogo.games;
    client_max_body_size 50m;

    # 演示站不该被搜索引擎收录
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 后台徽标的 SSE 长连接：必须关 buffering，否则事件被攒着不下发
    location = /api/v1/admin/dashboard/badges/stream {
        proxy_pass http://127.0.0.1:3000/api/v1/admin/dashboard/badges/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/demo-admin.betogo.games/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/demo-admin.betogo.games/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = demo-admin.betogo.games) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name demo-admin.betogo.games;
    return 404; # managed by Certbot


}