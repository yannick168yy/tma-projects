# 平台控制台的生产入口（宿主 nginx）。放到 /etc/nginx/sites-available/ 后软链启用。
#
# 🔴 启用前必须做完三件事，缺一件这份配置要么不生效，要么把后台暴露出去：
#   1. DNS：把 platform.betogo.games 的 A 记录指向 13.213.107.231
#   2. 证书：sudo certbot certonly --nginx -d platform.betogo.games
#      （现有 betogo.games 证书的 SAN 只有 betogo.games / origin / www，不覆盖这个子域）
#   3. 访问控制：2026-09-07 起改为「强制 Google Authenticator」而非 IP 白名单 ——
#      运维出口走消费级 VPN，只能整段放行，等于信任同一家 VPN 的所有用户。
#      门禁改成跟人走：密码 + TOTP + 连错 5 次锁 15 分钟（见 routes/platform/index.ts）。
#      这个后台能开站、改套餐、看所有租户的资金，别把这三道一起关掉。
#
# 容器由 recreate-web-platform.sh 创建，只监听 127.0.0.1:8090。

server {
    listen 80;
    server_name platform.betogo.games;

    # 续期是 webroot 认证（/etc/letsencrypt/renewal/*.conf 里 authenticator=webroot）。
    # 这个 location 必须排在 301 前面：否则 ACME 挑战被 301 带去 443 再落到 SPA 兜底，
    # 拿回 index.html 而不是挑战串，续期会稳定失败——证书过期前没有任何报错提示。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name platform.betogo.games;

    ssl_certificate     /etc/letsencrypt/live/platform.betogo.games/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.betogo.games/privkey.pem;

    # ── 访问控制 ────────────────────────────────────────
    # 这里刻意不做 IP 限制：2026-09-07 起改由应用层强制两步验证承担门禁。
    # 若将来要再加一层网络限制，在这里加 allow/deny，不要动应用层那三道。

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/platform.access.log;
    error_log  /var/log/nginx/platform.error.log;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 这里刻意用 $remote_addr 覆盖而不是 $proxy_add_x_forwarded_for 追加：
        # 后端 app.proxy=true 取 XFF 首段作为 ctx.ip，而追加式写法会把客户端自带的
        # XFF 留在首段 —— 攻击者每次换一个伪造 IP，登录失败 5 次锁定就永远锁不到他头上。
        # 平台后台前面没有别的反代，$remote_addr 就是真实客户端。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
