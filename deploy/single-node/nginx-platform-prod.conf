# 平台控制台的生产入口（宿主 nginx）。放到 /etc/nginx/sites-available/ 后软链启用。
#
# 🔴 启用前必须做完三件事，缺一件这份配置要么不生效，要么把后台暴露出去：
#   1. DNS：把 platform.betogo.games 的 A 记录指向 13.213.107.231
#   2. 证书：sudo certbot certonly --nginx -d platform.betogo.games
#      （现有 betogo.games 证书的 SAN 只有 betogo.games / origin / www，不覆盖这个子域）
#   3. 白名单：把下面的 allow 换成实际办公/运维出口 IP —— 默认是 deny all，
#      这是刻意的：宁可自己先访问不了，也不能有一刻是全网可达。
#      这个后台能开站、改套餐、看所有租户的资金。
#
# 容器由 recreate-web-platform.sh 创建，只监听 127.0.0.1:8090。

server {
    listen 80;
    server_name platform.betogo.games;

    # 续期是 webroot 认证（/etc/letsencrypt/renewal/*.conf 里 authenticator=webroot）。
    # 这个 location 必须排在 301 前面：否则 ACME 挑战被重定向进 443，而 443 是 deny all，
    # 续期会稳定吃 403 失败——证书过期前不会有任何报错提示。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name platform.betogo.games;

    ssl_certificate     /etc/letsencrypt/live/platform.betogo.games/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.betogo.games/privkey.pem;

    # ── 访问控制 ────────────────────────────────────────
    # 2026-09-06：运维出口走新加坡消费级 VPN，出口 IP 在该 /24 内轮换，无法钉死单个地址。
    # 代价是同一家 VPN 的其他用户也能过这道门禁，此时只剩账号密码一道防线。
    # 将来拿到固定出口 IP，应收紧成单 IP。
    allow 194.5.82.0/24;
    deny all;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/platform.access.log;
    error_log  /var/log/nginx/platform.error.log;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
