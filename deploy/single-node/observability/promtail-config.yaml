server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://tma-loki:3100/loki/api/v1/push

scrape_configs:
  # Podman 容器日志（json-file → ctr.log）
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/?(tma-bff-node|tma-core-node).*'
        action: keep
      - source_labels: ['__meta_docker_container_name']
        regex: '/?(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      - source_labels: ['__meta_docker_container_id']
        target_label: __path__
        replacement: /var/lib/containers/storage/overlay-containers/$1/userdata/ctr.log
      - replacement: containers
        target_label: job

  # 宝塔 Nginx 站点日志
  - job_name: nginx
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          __path__: /host/nginx/*188facai*.log
