# BetoGo 平台控制台（包网运营商管理）静态目录。
#
# 安全边界：平台后台不应与租户站点共用域名 —— 生产必须用独立域名 + IP 白名单。
# 测试环境只有一个域名，这里用路径 + IP 白名单临时承载。
location = /platform { return 301 /platform/; }
location /platform/ {
    # 只允许办公/运维出口 IP 访问。上线前按实际出口 IP 调整。
    # allow 1.2.3.4;
    # deny all;
    root /www/wwwroot/188facai.com;
    try_files $uri $uri/ /platform/index.html;
    add_header Cache-Control "no-store";
    add_header X-Robots-Tag "noindex, nofollow" always;
}
