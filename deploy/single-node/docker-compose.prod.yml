# 生产 compose：web + BFF + core-node + Redis + NATS + 容器 MySQL
#   docker compose -f deploy/single-node/docker-compose.prod.yml up -d --build

services:
  mysql:
    image: mysql:8.0
    container_name: tma-mysql
    restart: unless-stopped
    ports:
      - '127.0.0.1:13306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-betogo}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=50
      - --innodb_buffer_pool_size=64M
      - --performance_schema=OFF
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD:-root_dev_only}']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    image: redis:7.0-alpine
    container_name: tma-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 96M

  nats:
    image: nats:2.10-alpine
    container_name: tma-nats
    restart: unless-stopped
    ports:
      - '127.0.0.1:4222:4222'
    command:
      - -js
      - --store_dir=/data
    volumes:
      - nats_data:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8222/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M

  core-node:
    build:
      context: ../../apps/core-node
      dockerfile: Dockerfile
    image: betogo-core-node:latest
    container_name: tma-core-node
    restart: unless-stopped
    ports:
      - '127.0.0.1:4000:4000'
    environment:
      NODE_ENV: production
      CORE_PORT: 4000
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      NATS_STREAM: BETOGO
      NATS_LEDGER_SUBJECT: betogo.ledger
      NATS_CALLBACK_SUBJECT: betogo.callback
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-betogo}
      MYSQL_USER: ${MYSQL_BETOGO_USER:-betogo}
      MYSQL_PASSWORD: ${MYSQL_BETOGO_PASSWORD:?Set MYSQL_BETOGO_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:4000/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 192M

  bff-node:
    build:
      context: ../../apps/bff-node
      dockerfile: Dockerfile
    image: betogo-bff-node:latest
    container_name: tma-bff-node
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      NODE_ENV: production
      BFF_PORT: 3000
      BFF_STORAGE: mysql
      REDIS_URL: redis://redis:6379
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-betogo}
      MYSQL_USER: ${MYSQL_BETOGO_USER:-betogo}
      MYSQL_PASSWORD: ${MYSQL_BETOGO_PASSWORD:?Set MYSQL_BETOGO_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      BFF_DEV_SKIP_TELEGRAM_AUTH: ${BFF_DEV_SKIP_TELEGRAM_AUTH:-false}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://www.188facai.com/auth/google/callback}
      AMMER_PAY_PROVIDER_TOKEN: ${AMMER_PAY_PROVIDER_TOKEN:-}
      USDT_TO_PHP_RATE: ${USDT_TO_PHP_RATE:-58}
      CORE_NODE_URL: http://core-node:4000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      core-node:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 192M

  web-tma:
    build:
      context: ../../apps/web-tma
      dockerfile: Dockerfile
      args:
        VITE_BFF_BASE_URL: ${VITE_BFF_BASE_URL:-https://www.188facai.com/api/v1}
        VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:-false}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_GOOGLE_REDIRECT_URI: ${VITE_GOOGLE_REDIRECT_URI:-https://www.188facai.com/auth/google/callback}
    image: tma-web-tma:latest
    container_name: tma-web-tma
    restart: unless-stopped
    ports:
      - '${WEB_TMA_PORT:-8080}:80'
    depends_on:
      bff-node:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  mysql_data:
  nats_data:
