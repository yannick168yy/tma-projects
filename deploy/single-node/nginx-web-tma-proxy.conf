# 宝塔：/www/server/panel/vhost/nginx/proxy/188facai.com/web-tma.conf
# 勿对 SPA/HTML 启用 proxy_cache（忽略 Cache-Control 会在宕机时缓存 502/空页）

location ~* ^/assets/.+\.js$ {
    root /www/wwwroot/188facai.com;
    default_type application/javascript;
    try_files $uri.gz =404;
    expires 7d;
    add_header Content-Encoding gzip always;
    add_header Vary Accept-Encoding always;
    add_header Cache-Control "public, immutable";
}

location ~* ^/assets/.+\.css$ {
    root /www/wwwroot/188facai.com;
    default_type text/css;
    try_files $uri.gz =404;
    expires 7d;
    add_header Content-Encoding gzip always;
    add_header Vary Accept-Encoding always;
    add_header Cache-Control "public, immutable";
}

location /assets/ {
    root /www/wwwroot/188facai.com;
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, immutable";
}

location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}
