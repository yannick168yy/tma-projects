# 日志栈：Loki + Promtail + Grafana（与 tma-prod 网络互通，仅本机访问 Grafana）
#   NGINX_LOG_DIR=/www/wwwlogs bash deploy/single-node/start-observability.sh

services:
  loki:
    image: grafana/loki:3.0.0
    container_name: tma-loki
    restart: unless-stopped
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          memory: 256M

  promtail:
    image: grafana/promtail:3.0.0
    container_name: tma-promtail
    restart: unless-stopped
    volumes:
      - ./observability/promtail-config.yaml:/etc/promtail/config.yml:ro
      - ${NGINX_LOG_DIR:-/www/wwwlogs}:/host/nginx:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 96M

  grafana:
    image: grafana/grafana:11.0.0
    container_name: tma-grafana
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: http://127.0.0.1:3001/
      GF_SERVER_DOMAIN: 127.0.0.1
      GF_SERVER_HTTP_PORT: 3000
      GF_SERVER_SERVE_FROM_SUB_PATH: 'false'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  loki_data:
  grafana_data:
  promtail_positions:

networks:
  default:
    name: ${TMA_PODMAN_NETWORK:-tma-prod}
    external: true
