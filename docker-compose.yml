# BetoGo 本地环境 — 默认最小栈：redis + bff-node + web-tma
# 用法: cp .env.example .env && ./scripts/local-deploy.sh
# 可选全量: docker compose --profile full up -d --build

services:
  mysql:
    profiles: ["full"]
    image: mysql:8.0
    container_name: tma-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tma}
      MYSQL_USER: ${MYSQL_USER:-tma}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tma_dev}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=200
      - --innodb_buffer_pool_size=128M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_dev_only}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7.0-alpine
    container_name: tma-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    # 开发环境关闭 RDB/AOF，配合 maxmemory 保持轻量
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M

  nacos:
    profiles: ["full"]
    image: nacos/nacos-server:v2.3.2-slim
    container_name: tma-nacos
    restart: unless-stopped
    ports:
      - "${NACOS_PORT:-8848}:8848"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    volumes:
      - nacos_data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 512M

  rabbitmq:
    profiles: ["full"]
    image: rabbitmq:3.13-management-alpine
    container_name: tma-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tma}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-tma_dev}
      # 内存水位见 infra/docker/rabbitmq/rabbitmq.conf（vm_memory_high_watermark.relative）
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 384M

  web-tma:
    build:
      context: ./apps/web-tma
      dockerfile: Dockerfile
      args:
        VITE_BFF_BASE_URL: ${VITE_BFF_BASE_URL:-http://localhost:3000/api/v1}
        VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:-false}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_GOOGLE_REDIRECT_URI: ${VITE_GOOGLE_REDIRECT_URI:-https://www.188facai.com/auth/google/callback}
    image: betogo-web-tma:latest
    container_name: tma-web-tma
    restart: unless-stopped
    ports:
      - "${WEB_TMA_PORT:-5173}:80"
    depends_on:
      bff-node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  bff-node:
    build:
      context: ./apps/bff-node
      dockerfile: Dockerfile
    image: betogo-bff-node:latest
    container_name: tma-bff-node
    restart: unless-stopped
    ports:
      - "${BFF_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      BFF_PORT: 3000
      BFF_STORAGE: ${BFF_STORAGE:-redis}
      REDIS_URL: redis://redis:6379
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      BFF_DEV_SKIP_TELEGRAM_AUTH: ${BFF_DEV_SKIP_TELEGRAM_AUTH:-true}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://www.188facai.com/auth/google/callback}
      AMMER_PAY_PROVIDER_TOKEN: ${AMMER_PAY_PROVIDER_TOKEN:-}
      USDT_TO_PHP_RATE: ${USDT_TO_PHP_RATE:-58}
      # MySQL / Nacos：仅 --profile full 时在 .env 中设置 MYSQL_HOST / NACOS_SERVER_ADDR
      MYSQL_HOST: ${MYSQL_HOST:-}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-betogo}
      MYSQL_USER: ${MYSQL_USER:-tma}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-batogo}
      NACOS_DATA_ID: ${NACOS_DATA_ID:-bff-node}
      NACOS_GROUP: ${NACOS_GROUP:-DEFAULT_GROUP}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

  # Java Core — 待定；启用: docker compose --profile full up -d
  core-java:
    profiles: ["full"]
    build:
      context: ./apps/core-java
      dockerfile: Dockerfile
    image: betogo-core-java:placeholder
    container_name: tma-core-java
    restart: unless-stopped
    ports:
      - "${CORE_JAVA_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  nacos_data:
